<header
  class="fixed inset-x-0 top-0 z-50 border-b transition-all duration-300"
  [class]="scrolled() || mobileMenuOpen()
    ? 'border-primary/20 bg-background/70 backdrop-blur-xl'
    : 'border-transparent'"
>
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

    <!-- Logo -->
    <a href="#top" class="flex items-center" (click)="closeMobileMenu()">
      <img
        src="images/logoAvisum.png"
        alt="Avisum"
        class="h-12 w-auto"
      />
    </a>

    <!-- Menú desktop -->
    <ul class="hidden items-center gap-8 md:flex">
      @for (item of nav; track item.href) {
        <li>
          <a
            [href]="item.href"
            (click)="closeMobileMenu()"
            class="text-sm font-medium uppercase tracking-widest text-muted-foreground transition-colors hover:text-primary"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Botones -->
    <div class="flex items-center gap-3">

      <!-- Ingresar desktop -->
      <a
        href="#apoyo"
        (click)="closeMobileMenu()"
        class="font-display hidden bg-primary px-6 py-2.5 text-base tracking-widest text-primary-foreground transition-transform hover:-translate-y-0.5 sm:inline-flex"
      >
        Ingresar
      </a>

      <!-- Botón menú móvil -->
      <button
        type="button"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Abrir menú"
        class="flex items-center justify-center text-muted-foreground md:hidden"
      >
        <app-icon
          [name]="mobileMenuOpen() ? 'arrow-right' : 'menu'"
          [size]="24"
        />
      </button>

    </div>
  </nav>

  <!-- Menú móvil -->
  @if (mobileMenuOpen()) {
    <ul
      class="flex flex-col border-t border-border bg-background/95 px-6 py-4 backdrop-blur-xl md:hidden"
    >
      @for (item of nav; track item.href) {
        <li>
          <a
            [href]="item.href"
            (click)="closeMobileMenu()"
            class="block py-3 text-sm font-medium uppercase tracking-widest text-muted-foreground transition-colors hover:text-primary"
          >
            {{ item.label }}
          </a>
        </li>
      }

      <!-- Ingresar móvil -->
      <li class="pt-2 sm:hidden">
        <a
          href="#apoyo"
          (click)="closeMobileMenu()"
          class="font-display block bg-primary px-6 py-3 text-center text-base tracking-widest text-primary-foreground"
        >
          Ingresar
        </a>
      </li>
    </ul>
  }
</header>
